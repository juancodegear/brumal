<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<title>Brumal</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
	background: #07080d;
}

body {
	color: #f4ead8;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	background: #07080d;
}

#canvas:focus {
	outline: none;
}

#gira {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 40;
	background: #141824;
	color: #f4ead8;
	align-items: center;
	justify-content: center;
	text-align: center;
	font-family: "Trebuchet MS", "Segoe UI", sans-serif;
	padding: 28px;
}

#gira h1 {
	font-size: 1.7rem;
	margin: 0 0 8px;
	letter-spacing: 0.08em;
}

#gira p {
	margin: 0;
	color: #e2b15a;
	font-size: 1.05rem;
}

#gira .flecha {
	font-size: 3rem;
	margin-bottom: 8px;
}

#carga {
	position: fixed;
	left: 50%;
	bottom: 12%;
	transform: translateX(-50%);
	width: min(440px, 86vw);
	z-index: 30;
	text-align: center;
	font-family: "Trebuchet MS", "Segoe UI", sans-serif;
}

#carga p {
	margin: 0 0 10px;
	color: #f4ead8;
	font-size: 1rem;
}

#carga progress {
	width: 100%;
	height: 16px;
	appearance: none;
}

#carga progress::-webkit-progress-bar {
	background: #243044;
	border-radius: 8px;
}

#carga progress::-webkit-progress-value {
	background: #e2b15a;
	border-radius: 8px;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #12141f;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #243044;
	border-radius: 0.5rem;
	border: 1px solid #e2b15a;
	color: #f4ead8;
	font-family: "Trebuchet MS", "Segoe UI", sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Tu navegador no puede mostrar el juego.
		</canvas>
		<div id="gira">
			<div>
				<div class="flecha">↔</div>
				<h1>BRUMAL</h1>
				<p>Gira el dispositivo. El valle se recorre en horizontal.</p>
			</div>
		</div>

		<noscript>
			Hace falta JavaScript para entrar en el valle.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<div id="carga">
				<p id="carga-texto">Preparando Brumal…</p>
				<progress id="status-progress" value="0" max="100"></progress>
			</div>
			<div id="status-notice"></div>
		</div>

		<script>
		const BRUMAL_VERSION = "44.1";
		const _brumalFetch = window.fetch.bind(window);
		window.fetch = function (input, init) {
			if (typeof input === "string" && /\.(wasm|pck)(\?|$)/.test(input) && input.indexOf("v=") === -1) {
				input += (input.indexOf("?") === -1 ? "?" : "&") + "v=" + BRUMAL_VERSION;
			}
			return _brumalFetch(input, init);
		};
		</script>
		<script src="index.js?v=44.1"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":31357124,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const cargaTexto = document.getElementById('carga-texto');
	const gira = document.getElementById('gira');
	let arrancado = false;

	function enHorizontal() {
		return window.matchMedia('(orientation: landscape)').matches || window.innerWidth >= window.innerHeight;
	}

	function decir(texto) {
		if (cargaTexto) {
			cargaTexto.textContent = texto;
		}
	}

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('No se pudo abrir el valle.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		const missingMsg = 'Faltan funciones del navegador para abrir Brumal:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		window.brumalListo = function () {
			setStatusMode('hidden');
			const canvas = document.getElementById('canvas');
			if (canvas) {
				canvas.focus();
			}
		};
		function arrancar() {
			if (arrancado) {
				return;
			}
			if (!enHorizontal()) {
				if (gira) {
					gira.style.display = 'flex';
				}
				decir('Gira el teléfono. El valle se abre en horizontal.');
				return;
			}
			if (gira) {
				gira.style.display = 'none';
			}
			const canvas = document.getElementById('canvas');
			if (canvas && canvas.clientWidth < 16) {
				decir('Ajustando la pantalla…');
				window.requestAnimationFrame(arrancar);
				return;
			}
			arrancado = true;
			setStatusMode('progress');
			decir('Descargando el valle…');
			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
						const pct = Math.round((current / total) * 100);
						decir('Descargando el valle… ' + pct + '%');
					} else {
						decir('Compilando…');
					}
				},
			}).then(() => {
				decir('Entrando al valle…');
			}, displayFailureNotice);
			window.setTimeout(function () {
				if (statusOverlay && statusOverlay.isConnected && arrancado) {
					decir('Sigue cargando. Si se queda aquí, recarga la página.');
				}
			}, 45000);
		}
		window.addEventListener('resize', arrancar);
		window.addEventListener('orientationchange', function () {
			window.setTimeout(arrancar, 200);
		});
		arrancar();
	}
}());
		</script>
	</body>
</html>
